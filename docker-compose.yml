# Local development stack.
#
# Brings up everything Ariadne needs to observe: its own graph store, the demo
# company's billing database, and a real n8n instance to crawl. The API and web
# app run on the host with hot reload (`pnpm dev`).
#
# For the VPS deployment see docker-compose.prod.yml.

name: ariadne

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ariadne
      POSTGRES_PASSWORD: ariadne
      POSTGRES_DB: ariadne
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, against an empty data volume. To re-run: docker compose down -v
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariadne -d ariadne"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The demo company's automation platform. Cartographer crawls this over the
  # public REST API, and Reflex restores workflow versions through it. Running
  # it in the stack is what keeps the demo path free of mocks.
  n8n:
    image: n8nio/n8n:1.75.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ariadne
      DB_POSTGRESDB_PASSWORD: ariadne
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-only-not-a-secret}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PUBLIC_API_DISABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: UTC
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  n8ndata:
