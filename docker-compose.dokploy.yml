# Production stack for Dokploy.
#
# Dokploy runs this as a Compose service and its bundled Traefik terminates
# TLS, so there is no reverse proxy here and nothing publishes a port. Attach
# domains in the Dokploy UI:
#
#   sadhak.online       -> web  : 3000
#   api.sadhak.online   -> api  : 3001
#   n8n.sadhak.online   -> n8n  : 5678
#
# Images are prebuilt by CI and pulled from GHCR, so a deploy is a pull and a
# restart, not a build on the VPS. Set the environment in the Dokploy UI:
# POSTGRES_PASSWORD, N8N_ENCRYPTION_KEY, OPENROUTER_API_KEY,
# OPENROUTER_MODEL_STRONG, OPENROUTER_MODEL_BULK, SESSION_SECRET,
# CREDENTIAL_MASTER_KEY.
#
# Connector tokens are no longer passed through: credentials are stored per org
# in the encrypted vault (docs/connectors/README.md).

# Pinned so the Alloy log collector has something stable to filter on, and so
# a plain `docker compose up` from any directory lands in one project.
#
# Dokploy ignores this. It passes its own `-p <repo>-<app>-<hash>`, and the CLI
# flag beats the file, so the project on the VPS is `sarvam-sadhak-jbqjkw`.
# Alloy's keep rule allows that shape too — do not narrow it back to a literal
# `sadhak` on the strength of this line.
name: sadhak

# Container logs are rotated, on every service.
#
# Docker's json-file driver is unbounded by default: one chatty container can
# fill the disk and take the whole box down, and that is true whether or not
# Loki is healthy. This closes it at the source, independently of anything the
# monitoring stack does.
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: sadhak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy}
      POSTGRES_DB: sadhak
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadhak -d sadhak"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    image: n8nio/n8n:1.75.2
    restart: unless-stopped
    <<: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: sadhak
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in Dokploy}
      N8N_HOST: n8n.sadhak.online
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.sadhak.online/
      N8N_PUBLIC_API_DISABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: UTC
    expose:
      - "5678"
    volumes:
      - n8ndata:/home/node/.n8n
    networks:
      - default
      - dokploy-network

  api:
    image: ghcr.io/${GHCR_OWNER:-ashtonmths}/sadhak-api:latest
    # `latest` is a moving tag, and `docker compose up -d` does not chase it:
    # finding an image of that name already on the host, it reuses it and
    # reports the service up to date. CI can publish a new `latest` on every
    # push to main and the VPS will keep restarting the build it first pulled —
    # a deploy that succeeds loudly and changes nothing.
    #
    # `always` is what makes a redeploy mean the current image. It costs a
    # registry round trip per deploy, which is a layer digest check when
    # nothing changed. Only the two moving tags carry it; db and n8n are pinned
    # to exact versions, where re-pulling buys nothing and adds a way to fail.
    pull_policy: always
    restart: unless-stopped
    <<: *logging
    depends_on:
      db:
        condition: service_healthy
    # Apply pending migrations, seed, then serve. The migration runner takes an
    # advisory lock, so two replicas booting together serialize instead of
    # racing DDL.
    #
    # Migrations gate the server: serving against a schema that failed to
    # migrate corrupts data rather than merely erroring. The seed does not gate
    # it. The seed is idempotent and adopts whatever already exists, so its
    # realistic failures are a replica losing an insert race or the demo crawl
    # target being absent — neither is a reason to refuse to serve the API, and
    # `&&` here would turn a cosmetic failure into an outage.
    command: >
      sh -c "pnpm --filter @sadhak/api db:migrate &&
      { pnpm --filter @sadhak/api seed || echo 'seed failed - serving anyway'; } &&
      pnpm --filter @sadhak/api start"
    # Docker's default 10s SIGKILL would cut in-flight crawls on every deploy;
    # the worker drains within 45s (JOBS_DRAIN_TIMEOUT_MS).
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sadhak:${POSTGRES_PASSWORD}@db:5432/sadhak
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      WEB_ORIGINS: https://sadhak.online,https://www.sadhak.online
      # Losing this key does not lose graph data, but every stored connector
      # credential becomes unreadable. Back it up outside Dokploy.
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?set CREDENTIAL_MASTER_KEY}
      CREDENTIAL_MASTER_KEY_PREVIOUS: ${CREDENTIAL_MASTER_KEY_PREVIOUS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL_STRONG: ${OPENROUTER_MODEL_STRONG:-openai/gpt-oss-120b}
      OPENROUTER_MODEL_BULK: ${OPENROUTER_MODEL_BULK:-inclusionai/ling-2.6-flash}

      # Embeddings go to OpenRouter here, not to the in-process model.
      #
      # Local embedding works and is free, but it needs an onnxruntime binary
      # for the host's architecture, a writable cache, a 130MB download on first
      # use and a few hundred MB of RAM. All four are fine on a laptop and all
      # four are a way for a small VPS to fail at the moment someone uploads a
      # transcript during a demo. MiniLM-L6-v2 returns the same 384 dimensions
      # for about half a cent per million tokens.
      #
      # Set this to `local` to go back. The API clears and recomputes the
      # vectors on the next boot, because the two models do not share a vector
      # space and mixing them degrades search without failing anything.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openrouter}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-sentence-transformers/all-minilm-l6-v2}

      # Observability. This container already joins `sadhak-obs` so Prometheus
      # can reach it, but reachable is not the same as scrapeable.
      #
      # /metrics 404s unless a token is configured and presented as a bearer —
      # deliberately 404 rather than 401, so the endpoint does not advertise
      # itself. Without this line the monitoring stack comes up looking healthy
      # while the `sadhak-api` target sits down with a 404, every panel on the
      # API dashboard empty and nothing on screen saying why. Must match the
      # value in ops/observability/prometheus/metrics-token.
      METRICS_TOKEN: ${METRICS_TOKEN:-}

      # Traces, to the Tempo on the same network. Absent, `startTracing()`
      # returns immediately and every span becomes a no-op the runtime
      # discards — which is the right behaviour with no collector, and the
      # wrong one now that there is one. 4318 is OTLP/HTTP; 3200 is queries.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      # Connector credentials live in the per-org vault, not here. N8N_BASE_URL
      # stays as the default base for instances that do not override it.
      N8N_BASE_URL: http://n8n:5678
      # The instance *owner* key, which is a different thing from the per-org
      # connector credentials above: it is what creates an n8n account for a
      # new signup, and it is unscoped, so it is operator-set and never
      # reachable from org config. Optional — without it the API still boots,
      # account provisioning reports itself skipped rather than failing, and
      # execution-failure polling no-ops.
      N8N_API_KEY: ${N8N_API_KEY:-}
      # Where a browser reaches n8n: the Traefik-terminated host, matching
      # N8N_HOST on the n8n service. Not the compose address above.
      N8N_PUBLIC_URL: https://n8n.sadhak.online
      PORT: "3001"

      # Where vendors redirect back to. Slack sends the browser here after a
      # grant, and the redirect must match the URL registered on the Slack app
      # exactly. Unset, `redirectUri()` throws and the connect button 500s.
      PUBLIC_API_URL: https://api.sadhak.online

      # Hosts the operator vouches for, bypassing the private-range check.
      # `db` is here because the Postgres crawler now goes through the egress
      # guard and the stack's own database is on the compose network — without
      # it a connector pointed at `db:5432` is refused as a private address.
      # Operator-set only: an org admin cannot add to this, or a tenant could
      # allowlist their way to the cloud metadata endpoint.
      EGRESS_ALLOW_PRIVATE_HOSTS: n8n,db

      # Raised for the demo, and only because of the mobile Alerts screen.
      #
      # It polls every 5s and each tick is two requests, so one phone sitting on
      # that screen spends 24/min of this budget continuously. The default of 60
      # holds two such devices; a room of them shares one NAT address and the
      # third person starts collecting 429s mid-demo.
      #
      # This is a presentation setting, not a considered limit. It weakens a
      # real control — the per-IP tier is what refuses an unauthenticated flood
      # before anything touches Postgres — so it wants lowering again, or the
      # poll lengthening, once the screen is not being shown live.
      RATE_LIMIT_IP_PER_MIN: "300"

      # GitHub. The token is the fallback the change store and the Historian
      # use where no App installation covers a repository; the App is what the
      # merge gate needs to post a Check Run. All optional — the API boots and
      # the deterministic verdict path works with none of them.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}

      # Slack OAuth, so connecting is a button rather than a token paste.
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    # Readiness, so a redeploy drains before it swaps: /readyz reports 503 the
    # moment shutdown starts, and keeps serving for DRAIN_DELAY_MS afterwards
    # so the proxy notices before the socket closes.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    # expose, never ports. Traefik is the only route to this container, which
    # is what makes the last X-Forwarded-For hop trustworthy in
    # src/http/client-ip.ts. Publish this port and every IP-keyed rate limit
    # becomes spoofable by anyone who can reach the host directly.
    expose:
      - "3001"
    volumes:
      - models:/models
    # Tell Traefik which of the three networks below to dial.
    #
    # This container is on `default`, `dokploy-network` and `sadhak-obs`. Traefik
    # only reaches it over `dokploy-network`, but given several it picks one on
    # its own, and picking either of the others produces a router that resolves
    # and a backend that never answers: a 502 with no request ever reaching the
    # app, so the api logs look perfectly healthy while the domain is down.
    #
    # `web` never hit this because it is on two networks and one of them is the
    # only plausible choice. The api gained a third for Prometheus, and the
    # ambiguity came with it.
    labels:
      - "traefik.docker.network=dokploy-network"
    networks:
      - default
      - dokploy-network
      # Lets Prometheus reach /metrics as http://api:3001 without the endpoint
      # ever being published to the internet.
      - sadhak-obs

  web:
    image: ghcr.io/${GHCR_OWNER:-ashtonmths}/sadhak-web:latest
    # Same moving tag, same reason as api above.
    pull_policy: always
    restart: unless-stopped
    <<: *logging
    depends_on:
      - api
    expose:
      - "3000"
    # Same label the api carries, and for the same reason.
    #
    # 4c81657 fixed this for the api and left web alone, reasoning that two
    # networks meant one plausible choice. That was wrong. Traefik picks among
    # whatever a container offers and the choice is not stable across
    # recreation, so "it has worked so far" was luck rather than a property —
    # and it ran out on the first deploy that recreated this container, which
    # came back 502 while the api beside it was fine.
    labels:
      - "traefik.docker.network=dokploy-network"
    networks:
      - default
      - dokploy-network

  # ------------------------------------------------------- observability
  #
  # In this file rather than only in ops/observability/docker-compose.
  # observability.yml, because Dokploy deploys one compose file from git — and
  # a second stack that nobody deploys is a monitoring stack that does not
  # exist. The blackbox probe said so plainly: grafana.sadhak.online was down
  # while the app beside it was up.
  #
  # The standalone file still works for running the stack on its own; these are
  # the same images and the same config, on the network the api already joins.

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    <<: *logging
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./ops/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    networks: [sadhak-obs]
    mem_limit: 512m

  # Alloy ships container logs into Loki over the Docker socket, mounted
  # read-only and never exposed over TCP. That is a real security surface and
  # it is registered in the threat model; see the config header.
  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    <<: *logging
    depends_on: [loki]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    networks: [sadhak-obs]
    mem_limit: 128m

  # No SADHAK_LOG_ENV here on purpose: the config defaults to `prod`, and this
  # is the deployment that does not get to set an environment variable by hand.
  tempo:
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    <<: *logging
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./ops/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo
    networks: [sadhak-obs]
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    <<: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/alerts:/etc/prometheus/alerts:ro
      - promdata:/prometheus
    # Generated from the same variable the api reads, rather than bind-mounted
    # from ops/observability/prometheus/metrics-token.
    #
    # That file is written by scripts/obs-local.sh and is gitignored, so it does
    # not exist in a deploy that clones this repo — Docker would create a
    # directory in its place and Prometheus would fail to read a credential that
    # looks present. Sourcing both sides from METRICS_TOKEN also removes the
    # footgun of the two drifting: a mismatch answers 404 to a request that
    # carries a token, which reads exactly like the endpoint being disabled.
    configs:
      - source: metrics_token
        target: /etc/prometheus/metrics-token
    networks: [sadhak-obs]
    mem_limit: 512m

  # Mounts the tracked `.example` URLs.
  #
  # The real ones are gitignored, and Dokploy deploys from git, so a compose
  # file referencing them would fail to start on every deploy. With the
  # placeholders the config loads, rules evaluate, and alerts group and route
  # and appear in the Alertmanager UI — only the final delivery hop is missing.
  # Replace the two files on the host to actually page anyone.
  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    <<: *logging
    volumes:
      - ./ops/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./ops/observability/alertmanager/slack-webhook-url.example:/etc/alertmanager/slack-webhook-url:ro
      - ./ops/observability/alertmanager/watchdog-url.example:/etc/alertmanager/watchdog-url:ro
      - alertmanagerdata:/alertmanager
    networks: [sadhak-obs]
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    <<: *logging
    depends_on: [loki, prometheus, tempo]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.sadhak.online
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    expose:
      - "3002"
    # Same label, same reason as the api and web above: Traefik picks among
    # whatever networks a container offers, and the choice is not stable across
    # recreation. This one offers two.
    labels:
      - "traefik.docker.network=dokploy-network"
    networks:
      - dokploy-network
      - sadhak-obs
    mem_limit: 256m

  # The exporters the infrastructure dashboard reads. Without them `pg_*`,
  # `node_*`, `container_*` and `probe_*` have no source and that dashboard
  # renders empty with nothing on it saying why.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    <<: *logging
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks: [sadhak-obs]
    mem_limit: 128m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    <<: *logging
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [sadhak-obs]
    mem_limit: 256m

  # On `default` as well, because that is where the database is. The standalone
  # stack reaches it across the host gateway instead, having no other route.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    <<: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgres://sadhak:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/sadhak?sslmode=disable
    networks:
      - default
      - sadhak-obs
    mem_limit: 128m

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    <<: *logging
    networks: [sadhak-obs]
    mem_limit: 128m

configs:
  # Inline content, interpolated at deploy time. Empty when METRICS_TOKEN is
  # unset, which Prometheus presents as an empty bearer and /metrics answers
  # 404 to — the same outcome as no token at all, and visible as a down target
  # rather than as a container that will not start.
  metrics_token:
    content: ${METRICS_TOKEN:-}

volumes:
  pgdata:
  lokidata:
  # Kept across restarts: dropping it throws away Alloy's read positions, and
  # the next start replays every container log file it can still see.
  alloydata:
  tempodata:
  promdata:
  alertmanagerdata:
  grafanadata:

  #
  # n8n's data, with a name that can be changed from Dokploy.
  #
  # n8n writes a generated encryption key into this volume on first boot and
  # then refuses to start against any other, so setting N8N_ENCRYPTION_KEY
  # after that first boot bricks the container with "Mismatching encryption
  # keys" and no way forward that does not involve a shell on the host.
  #
  # Naming the volume from an environment variable makes that recoverable from
  # the Dokploy UI alone: bump N8N_DATA_VOLUME to any new value and the next
  # deploy starts n8n on a fresh volume that adopts the configured key. The old
  # volume is orphaned rather than deleted, so nothing is destroyed and the
  # change is reversible by setting the name back.
  #
  # The alternative is reading the key out of the volume and matching it, which
  # is correct when there is n8n data worth keeping and needs a terminal.
  #
  n8ndata:
    name: ${N8N_DATA_VOLUME:-sadhak-n8ndata}

  models:

networks:
  # Created here, not declared external, which is the difference between a
  # deploy that works and one that does not.
  #
  # Both this stack and ops/observability declared it external, so neither
  # created it and each assumed the other had. Nothing did: the only thing that
  # ever ran `docker network create sadhak-obs` was scripts/obs-local.sh, which
  # is for a laptop and never runs on the VPS. Every deploy failed attaching the
  # api container to a network that did not exist.
  #
  # The app stack owns it because the app is what is always deployed, and it has
  # to come up whether or not anyone is running monitoring. `name` pins the
  # literal network name so compose does not prefix it with the project — the
  # observability stack still joins it as external, and now finds it there.
  sadhak-obs:
    name: sadhak-obs
  # Genuinely external: Dokploy creates this one, and Traefik routes through it.
  dokploy-network:
    external: true
