name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      # A variable added to the env schema but not documented is invisible to
      # whoever deploys next; one documented but read by nothing is a lie.
      - name: .env.example is in step with the env schema
        run: pnpm check:env

      # The positioning rests on being straighter than the category. A claim
      # that drifts into the docs is caught here rather than by a reviewer.
      - name: Docs make no claim this product cannot support
        run: pnpm check:docs

      # A reference that lies is worse than none: a caller builds against it
      # and finds out at runtime.
      - name: API reference matches the routes
        run: pnpm check:api

      # Reflex detects and reverts; it cannot prevent a change made in a
      # browser tab. That is the sentence most tempting to soften and the one
      # whose softening would cost the most trust, so it is enforced here
      # rather than left to a reviewer noticing.
      - name: Docs never claim Reflex prevents anything
        run: pnpm check:claims

      # The spec is generated from the zod objects the handlers validate with,
      # so a changed request shape changes the document a caller builds
      # against. Committed and diffed for the same reason as the migration
      # journal: a spec that only exists at runtime is one nobody notices
      # breaking.
      - name: OpenAPI spec matches the schemas
        run: pnpm check:openapi

  # The monitoring stack is source too, and its failures are silent at deploy
  # time: a dashboard pointing at a datasource that does not exist renders
  # empty, and an alert with no next action is discovered at 2am.
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Dashboards parse, uids are unique, datasource references resolve, and
      # every alert rule carries an action a responder can follow.
      - name: Dashboards and alert rules are coherent
        run: pnpm check:obs

      # promtool and amtool judge the syntax check:obs cannot. Both caught real
      # bugs: a credentials file that was never mounted, and a webhook url that
      # Alertmanager takes literally because it does no variable expansion.
      - name: Prometheus rules and config are valid
        run: |
          touch ops/observability/prometheus/metrics-token
          docker run --rm -v "$PWD/ops/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Alertmanager config is valid
        run: |
          touch ops/observability/alertmanager/slack-webhook-url
          touch ops/observability/alertmanager/watchdog-url
          docker run --rm -v "$PWD/ops/observability/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool prom/alertmanager:v0.28.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Compose projects are valid
        run: |
          GF_SECURITY_ADMIN_PASSWORD=ci POSTGRES_EXPORTER_DSN=postgres://ci \
            docker compose -f ops/observability/docker-compose.observability.yml config >/dev/null

  # Supply chain. This repository holds read credentials to other people's
  # production systems, so a leaked key here is not a repository problem.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # TruffleHog diffs commits, so it needs more than the tip.
          fetch-depth: 0

      # --only-verified: an unverified match is a string that merely looks like
      # a key. A scanner that cries wolf is one people stop reading, and this
      # gate is only worth having if a red build here means something.
      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      # Trivy reads pnpm-lock.yaml directly, so this covers dependency
      # vulnerabilities as well as the filesystem. `pnpm audit` is deliberately
      # not used: on pnpm 9.15 it fails parsing the registry response, so it
      # would redden the build without ever having found anything.
      #
      # ignore-unfixed, because a gate that cannot be satisfied gets bypassed.
      - name: Scan dependencies and filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      # Called out separately from the unit run so a determinism failure reads
      # as "the verdict changed" rather than as one more red test.
      - name: Verdict goldens
        run: pnpm test:goldens

      - name: Build web
        run: pnpm --filter @sadhak/web build

  # The tier that needs a database. Split from `check` rather than folded into
  # it so a missing service container fails loudly here instead of quietly
  # skipping the tests that cover tenant isolation and the shared limiter.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sadhak
          POSTGRES_PASSWORD: sadhak
          POSTGRES_DB: sadhak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sadhak"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:int

  # The product spine through a real browser. Slow and the flakiest tier, so it
  # stays small: only the joins no lower layer can see — a route that renders
  # but never fetches, a session the browser rejects, a verdict that returns
  # 200 and paints nothing.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sadhak
          POSTGRES_PASSWORD: sadhak
          POSTGRES_DB: sadhak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sadhak"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sadhak:sadhak@localhost:5432/sadhak
      CREDENTIAL_MASTER_KEY: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # No model provider in CI. The spine must not need one — the verdict path
      # imports no model, and this proves it rather than assuming it.
      LLM_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install chromium --with-deps

      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm seed

      - name: Build web
        run: pnpm --filter @sadhak/web build

      - name: Start the stack
        run: |
          pnpm --filter @sadhak/api start &
          pnpm --filter @sadhak/web start &
          npx --yes wait-on http://localhost:3001/healthz http://localhost:3000 -t 90000

      - name: E2E
        run: pnpm test:e2e

      # DAST against the stack this job already stands up. A baseline scan
      # (passive: it crawls and inspects responses, it does not attack) is the
      # honest level for a pipeline gate — an active scan against an ephemeral
      # container mostly produces findings about the container.
      #
      # Non-blocking on purpose, for now. A scanner wired to fail the build on
      # its first run is a scanner someone disables that afternoon; the report
      # is uploaded so the findings get read and triaged into the threat model
      # before it is given teeth.
      - name: DAST baseline scan
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$PWD/dast:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -I -r report.html || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-report
          path: dast/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Every migration, from zero, on real pgvector — so a bad migration is caught
  # on a Tuesday rather than at container boot in production.
  migrate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sadhak
          POSTGRES_PASSWORD: sadhak
          POSTGRES_DB: sadhak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sadhak"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sadhak:sadhak@localhost:5432/sadhak
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply every migration from zero
        run: pnpm db:migrate

      # Drift guard: a schema.ts change without a generated migration fails here
      # instead of silently diverging from what production runs.
      - name: Schema and migrations are in step
        run: |
          pnpm db:generate
          git diff --exit-code db/migrations

  docker:
    # The api image is otherwise never exercised before merge, so a broken
    # Dockerfile would only surface on main.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.sadhak.online

  images:
    # Build once, on main only. Pull requests are covered by check and docker.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, lint, security, migrate-check, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/finite-loop-club-nmamit/sadhak-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.sadhak.online

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Dokploy
        env:
          HOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DOKPLOY_WEBHOOK_URL is not set — refusing to report a deploy that did not happen."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
          echo "Dokploy redeploy triggered."

      # This proves the stack *responds*, not that it is correct — and there is
      # no rollback for it to trigger. A red step means production is down, and
      # the remediation is to revert the commit (docs/DEVELOPMENT.md).
      - name: Smoke — wait for both origins to answer
        run: |
          deadline=$((SECONDS + 180))
          api_ok=0; web_ok=0
          while [ $SECONDS -lt $deadline ]; do
            if [ $api_ok -eq 0 ] && curl -fsS https://api.sadhak.online/health | grep -q '"ok":true'; then
              echo "api healthy"; api_ok=1
            fi
            if [ $web_ok -eq 0 ] && curl -fsS -o /dev/null https://sadhak.online/; then
              echo "web healthy"; web_ok=1
            fi
            [ $api_ok -eq 1 ] && [ $web_ok -eq 1 ] && exit 0
            sleep 5
          done
          echo "deploy did not come up within 180s (api=$api_ok web=$web_ok)"
          exit 1
