# The api and web containers, on top of the local stack.
#
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# docker-compose.yml alone brings up db and n8n and expects the apps to run on
# the host under `pnpm dev`, which is the right shape for writing code. This
# file is for the other question: does the thing that gets deployed actually
# work? It builds the same two Dockerfiles CI publishes and runs them against
# the local database, so the images are exercised rather than assumed.
#
# It joins the `sadhak` project, so `pgdata` and `n8ndata` are the volumes you
# already have — same org, same tracked repo, same checkpoints. Nothing is
# reinitialised.
#
# The difference from docker-compose.dokploy.yml is deliberate: ports are
# published directly instead of going through Traefik, and there are no
# external networks. That removes the entire routing layer from the picture,
# which is what makes this useful when the deployed stack is misbehaving --
# if it works here and not there, the app is fine and the proxy is not.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    # Same as production: migrate, seed, then serve. Running it here means a
    # broken migration is caught on a laptop rather than during a deploy — which
    # only holds while this chain matches the one in docker-compose.dokploy.yml,
    # including the seed being unable to stop the server coming up.
    command: >
      sh -c "pnpm --filter @sadhak/api db:migrate &&
      { pnpm --filter @sadhak/api seed || echo 'seed failed - serving anyway'; } &&
      pnpm --filter @sadhak/api start"
    environment:
      NODE_ENV: production
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-sentence-transformers/all-minilm-l6-v2}
      PORT: "3001"
      DATABASE_URL: postgres://sadhak:sadhak@db:5432/sadhak
      # Written to .env by `pnpm obs:up`, and needed here for the same reason
      # it is needed there: /metrics 404s unless a token is configured and
      # presented as a bearer. Without this line the observability stack comes
      # up looking healthy while the sadhak-api scrape target sits `down` with
      # a 404 — every panel in the API dashboard empty, and nothing saying why.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Traces, to the Tempo in the observability stack.
      #
      # Not the value obs-local.sh writes into .env. That one is
      # http://localhost:4318, which is correct for `pnpm dev` on the host and
      # wrong from in here, where localhost is this container and the spans go
      # nowhere. `tempo` below is an extra_hosts alias for the host gateway.
      #
      # Set unconditionally rather than gated on the observability stack being
      # up. The exporter's failure mode when Tempo is absent is to retry and
      # drop, and tracing.ts installs no diag logger, so it is silent rather
      # than noisy — a stopped monitoring stack costs a little buffering, not
      # a log full of connection errors.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      # Read from .env so the vault opens the credentials already stored in the
      # local database. A different key here would leave every connector
      # unreadable and look like data loss.
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?set CREDENTIAL_MASTER_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Both, because the containerised web app is on 3005 while `pnpm dev`
      # keeps 3000. NODE_ENV is production in this container, so an origin that
      # is missing here is refused outright — and it surfaces in the browser as
      # a CORS error, which reads like a proxy fault rather than a config one.
      WEB_ORIGINS: http://localhost:3000,http://localhost:3005
      # `db` and `n8n` resolve to compose-network addresses, which the egress
      # guard treats as private and refuses without this.
      EGRESS_ALLOW_PRIVATE_HOSTS: n8n,db
      N8N_BASE_URL: http://n8n:5678
      # The instance owner key, minted by `pnpm n8n:bootstrap`. Without it the
      # api still serves: account provisioning reports itself skipped rather
      # than failing, and execution polling no-ops.
      N8N_API_KEY: ${N8N_API_KEY:-}
      # Browser-facing, so localhost and the published port — not the compose
      # service name above, which resolves only between containers.
      N8N_PUBLIC_URL: http://localhost:5678
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_STRONG: ${OPENROUTER_MODEL_STRONG:-}
      OPENROUTER_MODEL_BULK: ${OPENROUTER_MODEL_BULK:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}

      # Slack OAuth, so the connector page offers a button rather than a token
      # paste. Absent, oauthConfigured() is false and the button silently does
      # not render — which reads as the feature having been removed.
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}

      # Where Slack sends the browser back. Must match the redirect URL on the
      # Slack app exactly. Locally that means a tunnel hostname, so this is
      # normally empty and the OAuth button will report why when clicked
      # instead of failing silently.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    ports:
      - "3001:3001"
    volumes:
      # Keeps the embedding model across rebuilds. Without it every `up --build`
      # re-downloads bge-small-en-v1.5.
      - models:/models

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked in at build time, not read at runtime — the browser resolves
        # this, so it is the host's address rather than the compose service's.
        NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    # 3005 on the host, because `pnpm dev` already owns 3000 and taking it would
    # mean killing someone's dev server to run a container. Inside, it is still
    # 3000 — only the published port moves.
    ports:
      - "3005:3000"

  # ------------------------------------------------------------ monitoring
  #
  # Prometheus and Grafana alongside the app, so `up` brings the dashboards
  # with it instead of needing a second command.
  #
  # This is not the full observability stack. `pnpm obs:up` also runs Loki,
  # Tempo, Alloy and four exporters, and it publishes Grafana and Prometheus on
  # these same ports — so run one or the other, never both, or the second will
  # fail to bind. What is here is the pair that answers "is the API healthy",
  # which is the reason to have monitoring open while working on the API.
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    depends_on:
      - api
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      # A config of its own rather than the production one. That file scrapes
      # exporters, Loki, Tempo and Alertmanager, none of which exist here, so
      # reusing it would fill /targets with red for services that were never
      # meant to be running.
      - ./ops/observability/prometheus/prometheus.app.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/metrics-token:/etc/prometheus/metrics-token:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  # Logs and traces, so Grafana's Explore is usable rather than pointing at
  # datasources that are not running.
  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./ops/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    mem_limit: 512m
    ports:
      # Loki ships no web UI, so opening this in a browser correctly 404s.
      # Published for curl and health checks; Grafana Explore is the interface.
      - "3100:3100"

  # Alloy ships container logs into Loki over the Docker socket. Mounted
  # read-only and never exposed over TCP — the config header treats this as a
  # real security surface, and it is.
  #
  # Worth knowing what changes here versus `pnpm obs:up`: there the API runs on
  # the host under `pnpm dev` and its logs never reach Loki. In this compose the
  # API is a container, so its logs do.
  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    depends_on: [loki]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    environment:
      # Without this the collector defaults to `prod`, and every query run on a
      # laptop reads {env="prod"} — the one time that matters is when somebody
      # is looking at their own machine and believes they are looking at the
      # VPS. The config header says so; this is the overlay that honours it.
      SADHAK_LOG_ENV: local
    mem_limit: 128m

  # Tempo. This is also what makes OTEL_EXPORTER_OTLP_ENDPOINT above resolve:
  # `tempo` is a sibling service on this network, so unlike the obs-stack path
  # there is no host-gateway alias to keep working.
  tempo:
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./ops/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo
    mem_limit: 512m
    ports:
      # 3200 for queries and health, 4318 for OTLP/HTTP ingest. Published so
      # curl and a host-run `pnpm dev` can both reach it.
      - "3200:3200"
      - "4318:4318"

  # The four exporters the infrastructure dashboard reads.
  #
  # Prometheus scrapes the API for everything Sadhak measures about itself, but
  # `pg_*`, `node_*`, `container_*` and `probe_*` have no other source — without
  # these, dashboard 4 renders entirely empty and nothing on it says why.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Straight to the compose service. The observability stack reaches the
      # database across the host gateway because it runs on its own network;
      # here `db` is a sibling, so there is no gateway hop to configure.
      DATA_SOURCE_NAME: postgres://sadhak:sadhak@db:5432/sadhak?sslmode=disable
    mem_limit: 128m

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    mem_limit: 128m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 256m

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-sadhak-dev}
      # Anonymous viewing is off; this publishes org counts and traffic volume.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # The same dashboards the production stack provisions, so a panel fixed
      # in one is fixed in both. Datasources are separate because the URL of
      # Prometheus differs between the two compose files.
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./ops/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/observability/grafana/provisioning-app/datasources:/etc/grafana/provisioning/datasources:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3002:3000"

volumes:
  models:
  promdata:
  grafanadata:
  lokidata:
  # Kept across restarts on purpose: dropping it throws away Alloy's read
  # positions, and the next start replays every container log file it can see.
  alloydata:
  tempodata:
