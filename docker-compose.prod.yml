# VPS deployment.
#
#   cp .env.example .env   and fill it in, including DOMAIN
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy terminates TLS and fetches certificates automatically, so point the
# domain's A record at the VPS before bringing this up.

name: ariadne

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ariadne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ariadne
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Deliberately no ports block. The database is reachable only on the
    # compose network. To inspect it, tunnel: ssh -L 5432:localhost:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ariadne} -d ariadne"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    image: n8nio/n8n:1.75.2
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-ariadne}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_PUBLIC_API_DISABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8ndata:/home/node/.n8n

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ariadne}:${POSTGRES_PASSWORD}@db:5432/ariadne
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL_STRONG: ${OPENROUTER_MODEL_STRONG}
      OPENROUTER_MODEL_BULK: ${OPENROUTER_MODEL_BULK}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      AIRTABLE_TOKEN: ${AIRTABLE_TOKEN}
      N8N_BASE_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY}
      PORT: "3001"
    volumes:
      # Keeps the embedding model across restarts. Without it the container
      # re-downloads it every time.
      - models:/models

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, api, n8n]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  n8ndata:
  models:
  caddydata:
  caddyconfig:
