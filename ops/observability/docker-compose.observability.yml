# The monitoring stack, deployed as its own Dokploy project.
#
# Separate from docker-compose.dokploy.yml on purpose: restarting Grafana must
# never restart the API, and an OOM in Loki must never be able to take the
# product down with it. Every service carries a memory limit for that reason —
# the observability stack is allowed to fail alone.
#
# Self-hosted rather than a log SaaS. Log lines here carry customer graph
# metadata: node names like `invoices.vat_rate`, Slack permalinks, org ids.
# "Structure, never payloads" is the product's central privacy claim, and
# shipping that exhaust to a third-party log vendor would complicate it for no
# capability we need. The honest cost: we operate this, and it dies with the
# VPS. Logs are diagnostics; the durable record is Postgres, which is backed up.
#
#   docker compose -f ops/observability/docker-compose.observability.yml up -d

name: sadhak-observability

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [sadhak-obs]
    mem_limit: 512m
    restart: unless-stopped
    <<: *logging

  # Alloy, not Promtail: Promtail is in LTS and Alloy is what Grafana supports
  # going forward. Starting a new deployment on the deprecated agent would be
  # borrowing a migration.
  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only, and never exposed over TCP. See the config header: this is a
      # real security surface and it is registered in the threat model.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [sadhak-obs]
    mem_limit: 128m
    restart: unless-stopped
    depends_on: [loki]
    <<: *logging

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      # The API serves /metrics behind a bearer token. Prometheus reads it from
      # a file rather than the config because the config is in git and the
      # token is not. Copy metrics-token.example, put the product stack's
      # METRICS_TOKEN in it; it is gitignored.
      - ./prometheus/metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus-data:/prometheus
    networks: [sadhak-obs]
    mem_limit: 512m
    restart: unless-stopped
    <<: *logging

  tempo:
    image: grafana/tempo:2.7.0
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks: [sadhak-obs]
    mem_limit: 512m
    restart: unless-stopped
    <<: *logging

  alertmanager:
    image: prom/alertmanager:v0.28.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      # No path in this URL, and that is load bearing. A path here makes
      # Alertmanager serve its whole API under that prefix, so Prometheus
      # posting to /api/v2/alerts gets a 404 and every alert is silently
      # dropped — while /api/v1/alertmanagers still lists it as active, because
      # that reports discovery and not delivery. Found by curling both paths.
      # Alertmanager is not publicly exposed; Grafana is the only monitoring
      # service behind Traefik, so there is no prefix to serve under anyway.
      - --web.external-url=http://alertmanager:9093
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # A dedicated incoming webhook to #sadhak-alerts. Deliberately not the
      # customer-facing Reflex bot token: an outage in a customer's Slack must
      # not be able to mute our own paging. A file rather than an env var —
      # Alertmanager does no interpolation in its config.
      - ./alertmanager/slack-webhook-url:/etc/alertmanager/slack-webhook-url:ro
      # The external heartbeat monitor, off this VPS on purpose: a dead-man's
      # switch hosted on the machine it watches proves nothing.
      - ./alertmanager/watchdog-url:/etc/alertmanager/watchdog-url:ro
      - alertmanager-data:/alertmanager
    networks: [sadhak-obs]
    mem_limit: 128m
    restart: unless-stopped
    <<: *logging

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.sadhak.online
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [sadhak-obs]
    mem_limit: 256m
    restart: unless-stopped
    depends_on: [loki, prometheus, tempo]
    <<: *logging

  # ------------------------------------------------------------- exporters

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks: [sadhak-obs]
    mem_limit: 128m
    restart: unless-stopped
    <<: *logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [sadhak-obs]
    mem_limit: 256m
    restart: unless-stopped
    <<: *logging

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      # A pg_monitor-granted role, not the application user. Surfaces
      # connections by application_name, which the pool naming made meaningful.
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:?set POSTGRES_EXPORTER_DSN}
    networks: [sadhak-obs]
    mem_limit: 128m
    restart: unless-stopped
    <<: *logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    networks: [sadhak-obs]
    mem_limit: 128m
    restart: unless-stopped
    <<: *logging

volumes:
  loki-data:
  alloy-data:
  prometheus-data:
  tempo-data:
  alertmanager-data:
  grafana-data:

networks:
  sadhak-obs:
    external: true
    name: sadhak-obs
