apiVersion: 1

providers:
  - name: sadhak
    orgId: 1
    folder: Sadhak
    type: file
    disableDeletion: true
    # Edits in the UI are overwritten on restart. Deliberate: dashboards are
    # code, and a panel someone fixed by clicking would otherwise vanish
    # silently on the next deploy with nobody knowing why.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
